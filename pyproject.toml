[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appworld-vanilla-eval"
version = "0.1.0"
description = "Modular vanilla (direct-inference) evaluation pipeline for AppWorld"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
appworld = ["appworld>=0.1.3"]

[project.scripts]
appworld-vanilla = "appworld_vanilla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
